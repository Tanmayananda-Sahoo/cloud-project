apiVersion: v1
kind: Namespace
metadata:
  name: rightsizing-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-1
  namespace: rightsizing-demo
  labels:
    app: app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-1
  template:
    metadata:
      labels:
        app: app-1
    spec:
      containers:
        - name: stress
          image: alexeiled/stress-ng
          args:
            - "--cpu"
            - "1"
            - "--cpu-load"
            - "10"
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "50M"
            - "--vm-keep"
            - "--vm-hang"
            - "3600"
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
